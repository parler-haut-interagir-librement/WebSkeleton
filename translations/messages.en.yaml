  feature:
    languages:
      title: French and English
      text: Every page under /fr or /en, French by default; one more language is one line of configuration and a translation file.
    ddd:
      title: Domain-driven design
      text: Domain, Application and Infrastructure layers, with the identifiers, errors and command and query buses of phil/ddd-bundle.
    ux:
      title: PHIL UX
      text: The phil-ux stylesheet and the recipes of the PHIL UX kit, light and dark, without a build step.
    bundles:
      title: What a site needs
      text: Security headers, legal notices, privacy policy, accessibility statement, contact form, sitemap, security.txt and structured data.
