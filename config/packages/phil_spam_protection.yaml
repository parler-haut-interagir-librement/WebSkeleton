# phil/spam-protection-bundle, which protects the contact form. In production, a used token is claimed under a lock
# of LOCK_DSN, so that two submissions of one token cannot both pass; on several servers, LOCK_DSN and the cache pool
# must be shared by all of them (or use a table: used_tokens: {connection: default}).
# See https://github.com/parler-haut-interagir-librement/spam-protection-bundle
when@prod:
    phil_spam_protection:
        used_tokens:
            lock_factory: lock.factory
