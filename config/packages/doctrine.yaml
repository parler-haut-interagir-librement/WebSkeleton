doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        # One DBAL type per identifier of phil/ddd-bundle, named after it in snake case: the column reads back the
        # identifier class it was written with. `bin/console make:ddd:identifier` writes the type; register it here.
        types:
            account_id: App\Account\Infrastructure\Persistence\Doctrine\Type\AccountIdType
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        # One mapping per context, for the entities of its infrastructure: Doctrine maps them, the domain never
        # sees them. A new context adds its own mapping here.
        mappings:
            Account:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Account/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Account\Infrastructure\Persistence\Doctrine\Entity'
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Shared\Infrastructure\Persistence\Doctrine\Entity'
            Text:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Text/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Text\Infrastructure\Persistence\Doctrine\Entity'

when@test:
    doctrine:
        dbal:
            # The test database MUST be isolated from the dev one: tests may drop the
            # schema, so a shared database means running the test suite wipes the data
            # you are working with.
            #
            # This suffix has NO effect on SQLite (the default driver here), which is
            # why the test DSN is overridden in .env.test. It takes over as soon as you
            # switch to MySQL/PostgreSQL, and "TEST_TOKEN" (set by ParaTest) then gives
            # each parallel process its own database.
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
