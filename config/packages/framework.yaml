# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    http_method_override: false
    handle_all_throwables: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true
    php_errors:
        log: true

    # The outbound HTTP calls: one scoped client per third party, each behind its circuit in phil_circuit_breaker.yaml.
    http_client:
        default_options:
            timeout: 10
        scoped_clients:
            # The example of the template, behind the circuit http.example: a site renames it after the third party it
            # calls, with its base URI, or removes it with its circuit.
            example.client:
                base_uri: '%env(EXAMPLE_API_URL)%'
                timeout: 5

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # No request of the tests leaves the machine: each answer comes from this factory, which the tests set.
        http_client:
            mock_response_factory: App\Tests\Support\MockResponses
