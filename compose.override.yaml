# Development additions to compose.yaml: PostgreSQL reachable from the workstation, on a port Docker picks
# (`docker compose port database 5432` prints it), and Mailpit, which catches the messages of the contact form
# (`docker compose port mailer 8025` prints the address of its inbox).
services:
  php:
    environment:
      MAILER_DSN: "smtp://mailer:1025"

  database:
    ports:
      - "127.0.0.1::5432"

  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
